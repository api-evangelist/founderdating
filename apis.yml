name: FounderDating
description: >-
  FounderDating was an online network that helped entrepreneurs find co-founders, advisors, and early
  team members to start companies. It was surfaced as a portfolio company of 500 Global and added to the
  API Evangelist network as a stub. Enrichment (2026-07-19) confirms FounderDating has been merged into
  CoFoundersLab: the founderdating.com domain now redirects to cofounderslab.com, a founder-matching and
  startup-community platform. Neither the legacy FounderDating brand nor the CoFoundersLab successor
  publishes a public developer API, OpenAPI/Swagger definition, developer portal, SDK/package, or any
  /.well-known discovery surface, so there are no API artifacts to search, generate, or derive. The
  founderdating.com host is additionally unreachable over HTTPS (connection times out; DNS points at a
  parked Tucows IP). This profile is retained as a historical company record rather than an active API
  provider.
